<line x1="300.0" y1="386.3" x2="409.6" y2="386.3" class="dim" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="322.8" y="403.1" class="lab" text-anchor="middle">Q  13.7 to the flat  (12.8)</text>
<text x="412" y="287" class="small">step 2.8 deep</text>
<text x="412" y="380" class="small">same both sides</text>
<text x="40" y="650" class="note">One straight cut across the circle, square to the tab, with the tab left standing</text>
<text x="40" y="671" class="note">in the middle. The standard allows O 33.8-34.0, K 7.9-8.0 and Q 13.2-13.7 mm.</text>
<text x="40" y="692" class="note">The cover is built for the largest of each plus clearance, so smaller flanges like</text>
<text x="40" y="713" class="note">yours fit too. Even the largest flange leaves a step 2.8 mm deep beside the tab.</text>
<text x="700" y="44" class="title">2. The cover around it</text>
<text x="700" y="68" class="small">Same view and scale. Bore Ø35.0, collar 43.0 mm square.</text>
