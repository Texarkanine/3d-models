<text x="700" y="650" class="note" fill="#23466f">Blue blocks: the keys, 4.5 mm tall on the seat, one in each step beside</text>
<text x="716" y="671" class="note" fill="#23466f">the tab. The bulb only goes in one way and turns 1 to 2 degrees at most;</text>
<text x="716" y="692" class="note" fill="#23466f">the mark on the back face shows where the tab goes.</text>
<text x="700" y="713" class="note" fill="#7a3db8">Purple dashed: your bulb (33.3 / 7.7 / 12.8). It sits inside the largest flange.</text>
<text x="700" y="734" class="note" fill="#a02b18">Red bands: where the clip arms cross the flange; the dark middle is the bump</text>
<text x="716" y="755" class="note" fill="#a02b18">that presses it. They now always land on full flange, well away from the step.</text>
