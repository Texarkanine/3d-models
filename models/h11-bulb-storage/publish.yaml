name: H11 Bulb Storage
description: |
  Holds a spare H11 bulb, halogen or LED, by its fins. The head is enclosed.

  Push the bulb in and twist it, like a headlamp socket. Two springy catches click behind the fins and hold it, so LED bulbs without the halogen's spring clip lock too.

  Also fits H8, H9 and H16 bulbs, which use the same cap (PGJ19). Not H8B, H9B or H11B.
manufacturing: |
  ### Material

  PETG (recommended)

  ### Printing

  Print as shown - open end down. No supports needed.

  If a catch is stuck to the wall after printing, run a knife through the gap around it.
