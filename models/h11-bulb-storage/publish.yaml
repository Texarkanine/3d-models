name: H8 H9 H11 H16 Bulb Storage
description: |
  Holds a spare headlight bulb by its fins. The head is enclosed. Works with filament and LED bulbs.

  Push the bulb in and twist it, like a headlamp socket. Two springy catches click behind the fins and hold it, so LED bulbs without the halogen's spring clip lock too.

  Also fits H8, H9 and H16 bulbs, which use the same cap (PGJ19).
manufacturing: |
  ### Material

  PLA (recommended)

  ### Printing

  Print as shown - open end down, tube up. No supports needed.
