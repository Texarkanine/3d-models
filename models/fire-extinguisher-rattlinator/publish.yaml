name: Fire-Extinguisher Rattlinator
description: |
  Stops the handle of a car-mounted fire extinguisher from rattling.

  The handle, trigger, and lock on a full-size extinguisher are light and loose, so they buzz at the frequencies a car runs at. This sleeve slides onto the business end of the handle, holds those parts still, and gives them soft plastic to touch to absorb the noise.

  Intended to be printed in TPU 95, which is firm enough to stay put and flexible enough to deform out of the way, so it does not impede the operation of the extinguisher. This means you don't have to remove it before use - just pull the pin and squeeze!

  Fit has been checked on 2.5 pound and 5 pound extinguishers.
manufacturing: |
  ## Material

  Designed to be printed in TPU 95.

  ## Printing Instructions

  Add a support-blocker on the ring (as shown in the slicer image); no supports are needed for the ring. See screenshot of slicer for reference.
