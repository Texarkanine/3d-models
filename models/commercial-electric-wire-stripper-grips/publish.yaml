name: Commercial Electric Wire Stripper Grips
description: |
  Replacement grips for a Commercial Electric wire stripper and crimper whose rubber grips have gone sticky or torn. There is one grip for each handle: `curved_grip` for the curved steel handle and `straight_grip` for the straight one. Pull the old grips off, print the new ones, and slide them onto the bare steel.

  Each grip's inside is shaped to its own handle's measured steel. Both share one outside: rounded, following the steel's taper, with a flared open end that keeps your fingers from sliding up toward the jaws. With both grips on, the tool still closes fully.

  Printed in TPU 95A, the grips are snug enough to stay on without glue. If you want them permanent, the inside has lengthwise grooves for glue to key into.

  Each fit test is the open end of its grip alone: a quick print to check the fit on your tool before you print the whole grip.

  Made for one tool: the Commercial Electric wire stripper and crimper with one curved and one straight steel handle, as pictured. Compare yours with the photos before printing.
manufacturing: |
  ### Material

  TPU 95A.

  ### Printing

  Open end down on the bed, as the files are oriented. No supports needed.
