name: Commercial Electric Wire Stripper Grips
description: |
  Replacement slide-on grips for a Commercial Electric wire stripper whose rubber grips have gone sticky. Print a new grip in TPU, pull the old one off, and slide the new one onto the bare steel handle.
manufacturing: |
  ### Material

  TPU 95A.

  ### Printing

  Open end down on the bed. No supports needed.
