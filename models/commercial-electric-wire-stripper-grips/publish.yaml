name: Commercial Electric Wire Stripper Grips
description: |
  Replacement grips for the "Commercial Electric Double Jaw Wire Stripper, Cutter and Crimper", model #CE190205, when its rubber grips have gone sticky or torn. Pull the old grips off, print the new ones, and slide them onto the bare steel.

  There is one grip for each handle: curved and straight. Both share one outside: rounded, following the steel's taper, with a flared open end that keeps your fingers from sliding up toward the jaws. With both grips on, the tool still closes, and the grips don't touch.

  Printed in TPU 95A, the grips are snug enough to stay on without glue. If you want them permanent, the inside has lengthwise grooves for glue to key into; pick something compatible with whichever material you actually printed with.

  Made for one tool: model CE190205 (Home Depot store SKU 1001 249 254), as pictured. There is a newer model under the same name: 91365 (store SKU 1011 098 874). It looks the same, but these grips haven't been tried on it.
manufacturing: |
  ### Material

  TPU 95A

  TPU90 would probably work, too, but I haven't tried. The friction-fit retention might not be as good with a softer material so you might need glue. LMK!

  ### Printing

  Open end down on the bed, as the files are oriented. No supports needed.
