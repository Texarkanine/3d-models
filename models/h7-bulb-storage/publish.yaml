name: H7 bulb storage
description: |
  Holds a spare H7 bulb by the flange. The head is enclosed, the back of the bulb stays free.
  
  Slide a clip into the slot to hold the bulb securely.
manufacturing: |
  Print as shown - tube down. No supports needed.

  Three clips are provided for different bulb flange thicknesses; if you have a thin flange (e.g. 1mm), you'll need a thicker clip - the `1.0-1.5mm` clip.
