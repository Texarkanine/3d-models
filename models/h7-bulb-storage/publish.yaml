name: H7 Bulb Storage
description: |
  Holds a spare H7 bulb by the flange. The head is enclosed, the back of the bulb stays free.
  
  Slide a clip into the slot to hold the bulb securely.
manufacturing: |
  ## Material Recommendation

  PLA

  ## Printing Instructions

  Print as shown - tube down. No supports needed.

  Various clips are provided for different bulb flange thicknesses.
  The thinner your flange, the thicker the clip you'll need. Print the clip labelled with the thickness of your bulb's flange's outer rim.
