name: H7 Bulb Storage
description: |
  Holds a spare H7 bulb by the flange. The head is enclosed, the back of the bulb stays free.
  
  Slide a clip into the slot to hold the bulb securely.
manufacturing: |
  ### Material

  PLA (recommended)

  ### Printing

  Print as shown - tube down. No supports needed.

  Several clips are provided for different bulb flange thicknesses. The flange is the thinnest part of the ring around the bulb's base. The thinner your flange, the thicker the clip you'll need. Print the clip labelled with the thickness of your bulb's flange's outer rim.

  The pictured LED bulbs have an 0.85mm thick flange, so they use the `h7_clip_flange_0.5-1.0mm.stl` clip.
