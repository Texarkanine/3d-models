name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tat to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          lfs: true

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: publisher
          sparse-checkout: tools

      - name: Resolve the model from the tag
        id: model
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          version="${TAG##*-v}"
          component="${TAG%-v${version}}"
          if [[ "$component" == "$TAG" || ! -f "$component/publish.yaml" ]]; then
            echo "Tag must look like <model>-vX.Y.Z and that model must contain publish.yaml." >&2
            exit 1
          fi
          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved $component at $version"

      - name: Upload to Cults
        id: upload
        env:
          COMPONENT: ${{ steps.model.outputs.component }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          CULTS3D_API_KEY: ${{ secrets.CULTS3D_API_KEY }}
        run: |
          python -m pip install pyyaml
          id="$(python publisher/tools/cults_publish.py)"
          echo "creation_id=$id" >> "$GITHUB_OUTPUT"

      - name: Record the Cults creation id on main
        env:
          COMPONENT: ${{ steps.model.outputs.component }}
          CREATION_ID: ${{ steps.upload.outputs.creation_id }}
        run: |
          rm -rf publisher
          echo "Writing cults_creation_id onto main."
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main refs/remotes/origin/main
          python tools/cults_publish.py --set-creation-id "$CREATION_ID"
          git add -- "$COMPONENT/publish.yaml"
          if git diff --cached --quiet -- "$COMPONENT/publish.yaml"; then
            echo "Creation id is already on main."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: record Cults creation id'
          git push origin HEAD:main
